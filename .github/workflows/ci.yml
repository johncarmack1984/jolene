name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a macOS or Xcode update that changes how badges are stored shows up within days.
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The current macOS and the one before it. When Apple ships a new macOS and GitHub adds
        # its runner, add it here and drop the oldest.
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version

      # Ad hoc signing without the hardened runtime lets the tests load into the app without a
      # signing certificate on the runner.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Jolene.xcodeproj \
            -scheme Jolene \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO
